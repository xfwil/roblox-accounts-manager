[package]
name = "ram-manager"
version = "0.2.0"
description = "Roblox Account Manager - Tauri rewrite"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"

# Logging
log = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# UUID for account IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Local Web API server
axum = "0.8"

# WebSocket (Nexus)
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# System tray
tauri-plugin-notification = "2"

# Process management
sysinfo = "0.33"

# Regex (lightweight, no-std compatible)
regex-lite = "0.1"

# Windows API (multi-Roblox mutex)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = ">=0.59, <=0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
